# Mannon's buyer-facing blocks.
#
# Three: the wholesale registration form, quick order by SKU, and the variants
# table on a product page.
#
# None of them computes a price. The registration form embeds the app's own
# page (docs/adr/0012); the two order blocks ask the app through Shopify's App
# Proxy, so the number a buyer is shown comes from the same pricing engine the
# checkout Function runs (docs/adr/0017).

api_version = "2025-07"

[[extensions]]
type = "theme"
name = "Mannon storefront"
handle = "mannon-storefront"
