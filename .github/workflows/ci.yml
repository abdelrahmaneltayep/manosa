name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI-only credentials. Real keys never leave the Shopify Partners dashboard.
  DATABASE_URL: postgresql://mannon:mannon@localhost:5432/mannon_test?schema=public
  TEST_DATABASE_URL: postgresql://mannon:mannon@localhost:5432/mannon_test?schema=public
  SHOPIFY_API_KEY: ci-api-key
  SHOPIFY_API_SECRET: ci-api-secret
  SHOPIFY_APP_URL: http://127.0.0.1:3210
  SCOPES: read_products

jobs:
  verify:
    name: Lint · typecheck · unit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mannon
          POSTGRES_PASSWORD: mannon
          POSTGRES_DB: mannon_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Lint
        run: npm run lint
      - name: Formatting
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and integration tests
        run: npm test
      - name: Build
        run: npm run build

  e2e-smoke:
    name: e2e smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mannon
          POSTGRES_PASSWORD: mannon
          POSTGRES_DB: mannon_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Smoke tests
        run: npx playwright test tests/e2e/smoke.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
