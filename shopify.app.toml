# Mannon — B2B Wholesale Pricing
#
# **This is not the app handled `mannon`.** That one is deployed from the
# `manosh` repository and already has a released version (`mannon-6`,
# quote-widget + customer-account-quotes). The two are separate Shopify apps
# that happen to share a product name, and the only thing that kept them apart
# was nobody having run `shopify app deploy` from here yet: an unpinned
# `client_id` binds by handle, and `include_config_on_deploy = true` would then
# have written this file over that app's config and released this repo's
# extensions in place of its own.
#
# So the handle below is distinct, and `npm run deploy` refuses until a
# `client_id` is pinned — see `app/lib/release/app-identity.ts`.
#
# Run `shopify app config link` once against **a new Partners app**, commit the
# `client_id` it writes, then `shopify app dev --store=mannon-9iu9ewku.myshopify.com`.
# Everything else in this file is checked in on purpose so the app config is
# reviewable in the diff rather than living only in the Partners dashboard.
#
# The five URLs below — `application_url`, the three `redirect_urls` and
# `app_proxy.url` — are **not edited by hand**. They come from
# `SHOPIFY_APP_URL` via `npm run config:urls`, which `npm run deploy` runs
# first; `npm run release:check` blocks while any of them names a development
# host. They say localhost here because nothing has been deployed yet, and
# because `automatically_update_urls_on_dev` below means the Shopify CLI
# rewrites them to its tunnel on every `shopify app dev`. One origin, five
# places, and the only way they stay consistent is for one command to write
# all five.

name = "mannon-wholesale"
handle = "mannon-wholesale"
# client_id = ""   # populated by `shopify app config link`
application_url = "https://localhost:3000"
embedded = true

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true

[access_scopes]
# Minimum scopes for Phase 0. Each later phase adds only what it needs and
# records the reason in docs/adr/. See PROGRESS.md.
# write_orders (3.1) is for one thing: tagging a wholesale order so the
# merchant can find it in Shopify's own admin too. Note that read_orders only
# reaches the last 60 days — see docs/adr/0014.
# read_inventory (4.2) is what the margin guard needs: unit cost lives on
# InventoryItem, and without it "this tier sells SKU-123 below cost" cannot be
# said at all — see docs/adr/0019.
scopes = "read_products,read_inventory,read_customers,write_customers,read_orders,write_orders,write_draft_orders,write_discounts"

[auth]
redirect_urls = [
  "https://localhost:3000/auth/callback",
  "https://localhost:3000/auth/shopify/callback",
  "https://localhost:3000/api/auth/callback"
]

# The storefront blocks call the app through Shopify's App Proxy, at
# /apps/mannon-wholesale/... on the merchant's own domain. The subpath is
# distinct for the same reason the handle is: a store can install both apps,
# and Shopify gives one prefix+subpath to one app. Shopify signs each request and
# passes the logged-in customer id — that signature is the whole security model
# for wholesale prices, since without it anyone could ask for any buyer's.
[app_proxy]
url = "https://localhost:3000/proxy"
prefix = "apps"
subpath = "mannon-wholesale"

[webhooks]
api_version = "2025-07"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  # Shopify's three mandatory privacy topics.
  #
  # `compliance_topics`, not `topics`. They are not registered through the API
  # like every other subscription — `@shopify/shopify-api`'s own `register.ts`
  # skips any topic in `privacyTopics` — so declaring them as `topics` here
  # means Shopify is never told where to send them and the handlers never run.
  # The feature ships inert and app review rejects the app.
  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request" ]
  uri = "/webhooks/customers/data-request"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/redact" ]
  uri = "/webhooks/customers/redact"

  [[webhooks.subscriptions]]
  compliance_topics = [ "shop/redact" ]
  uri = "/webhooks/shop/redact"

  [[webhooks.subscriptions]]
  topics = [ "app_subscriptions/update" ]
  uri = "/webhooks/app-subscriptions/update"

  [[webhooks.subscriptions]]
  topics = [ "customers/create" ]
  uri = "/webhooks/customers/create"

  [[webhooks.subscriptions]]
  topics = [ "customers/update" ]
  uri = "/webhooks/customers/update"

  [[webhooks.subscriptions]]
  topics = [ "customers/delete" ]
  uri = "/webhooks/customers/delete"

  [[webhooks.subscriptions]]
  topics = [ "orders/create" ]
  uri = "/webhooks/orders/create"

  [[webhooks.subscriptions]]
  topics = [ "orders/updated" ]
  uri = "/webhooks/orders/updated"

  [[webhooks.subscriptions]]
  topics = [ "orders/edited" ]
  uri = "/webhooks/orders/edited"

  [[webhooks.subscriptions]]
  topics = [ "orders/cancelled" ]
  uri = "/webhooks/orders/cancelled"

  [[webhooks.subscriptions]]
  topics = [ "products/update" ]
  uri = "/webhooks/products/update"

  [[webhooks.subscriptions]]
  topics = [ "collections/update" ]
  uri = "/webhooks/collections/update"

  [[webhooks.subscriptions]]
  topics = [ "shop/update" ]
  uri = "/webhooks/shop/update"

[pos]
embedded = false
